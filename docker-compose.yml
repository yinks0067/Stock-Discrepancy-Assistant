# One command demo:  docker compose up --build   ->  http://localhost:3000
# Add ANTHROPIC_API_KEY to a .env file to switch from offline mode to the Claude agent.
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: stock }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app -d stock"], interval: 2s, retries: 20 }
    ports: ["5432:5432"]

  seed:          # creates the tables and loads the generated CSVs, then exits
    image: postgres:16-alpine
    depends_on: { db: { condition: service_healthy } }
    working_dir: /work
    volumes: ["./db:/work/db:ro", "./data:/work/data:ro"]
    environment: { PGPASSWORD: app }
    command: psql -h db -U app -d stock -v ON_ERROR_STOP=1 -f db/schema.sql -f db/load.sql

  app:
    build: .
    depends_on: { seed: { condition: service_completed_successfully } }
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/stock
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["3000:3000"]
